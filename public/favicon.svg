<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2f4a"/>
      <stop offset="0.55" stop-color="#1f5a83"/>
      <stop offset="1" stop-color="#ec5f43"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b2236" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="416" cy="98" r="42" fill="#ffc94d" opacity="0.95"/>

  <!-- rota da viagem: GRU -> destinos -->
  <path d="M112 392 C 190 330, 214 214, 330 166" fill="none" stroke="#ffffff" stroke-opacity="0.8"
        stroke-width="14" stroke-linecap="round" stroke-dasharray="4 34"/>

  <!-- aviao subindo pela rota -->
  <g filter="url(#soft)" transform="translate(300 128) rotate(38)">
    <path d="M0 -66 C 12 -44, 18 -18, 18 6 L 74 46 L 74 72 L 18 54 L 18 92 L 40 112 L 40 130 L 0 118 L -40 130 L -40 112 L -18 92 L -18 54 L -74 72 L -74 46 L -18 6 C -18 -18, -12 -44, 0 -66 Z"
          fill="#ffffff"/>
  </g>

  <!-- pino de partida -->
  <g transform="translate(112 392)">
    <path d="M0 26 C -30 -14, -34 -26, -34 -40 A 34 34 0 1 1 34 -40 C 34 -26, 30 -14, 0 26 Z" fill="#ffc94d"/>
    <circle cx="0" cy="-40" r="13" fill="#0f2f4a"/>
  </g>
</svg>
